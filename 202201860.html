<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Messiahlyn Mae G. Mabilangan - Profile</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #eef5ee;
    margin: 0;
    padding: 40px;
    display: flex;
    justify-content: center;
  }
  .card {
    background: #ffffff;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    max-width: 500px;
    width: 100%;
    text-align: center;
    overflow: hidden;
  }
  .header {
    background-color: #046a38; 
    color: #ffcc00;           
    padding: 15px 20px;
  }
  .header img {
    width: 55px;
    height: 55px;
    vertical-align: middle;
    margin-right: 10px;
  }
  .header span {
    font-weight: bold;
    font-size: 16px;
    vertical-align: middle;
  }
  .body-content {
    padding: 30px;
  }
  .card img.profile-photo {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 15px;
    border: 4px solid #046a38;
  }
  h1 {
    margin: 10px 0 5px;
    font-size: 24px;
  }
  h1 a {
    color: #046a38;
    text-decoration: none;
  }
  h1 a:hover {
    text-decoration: underline;
    color: #ffcc00;
  }
  .student-number {
    color: #777;
    margin-bottom: 15px;
  }
  .info {
    text-align: left;
    margin-top: 20px;
  }
  .info p {
    margin: 8px 0;
  }
  .label {
    font-weight: bold;
    color: #046a38;
  }
  .footer {
    background-color: #046a38;
    color: #ffcc00;
    font-size: 12px;
    padding: 10px;
  }
</style>
</head>
<body>

  <div class="card">
    <div class="header">
      <span>Cavite State University</span>
    </div>

    <div class="body-content">
      <h1>
        <a href="https://202201860.github.io" target="_blank">
          Messiahlyn Mae G. Mabilangan
        </a>
      </h1>
      <p class="student-number">Student No: 202201860</p>

      <div class="info">
        <p><span class="label">Course / Year & Section:</span> BSIT 4-2</p>
        <p><span class="label">Campus:</span> Main Campus - Indang</p>
      </div>
    </div>

    <div class="footer">
      Cavite State University
    </div>
  </div>

</body>
</html>
